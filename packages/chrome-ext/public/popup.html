<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>qlinter</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body class="ql:min-w-70 ql:px-3.5 ql:py-3 ql:font-sans ql:text-sm ql:text-foreground ql:bg-background">
    <div class="ql:flex ql:items-center ql:gap-2">
      <span
        id="status-dot"
        class="ql:size-2.25 ql:shrink-0 ql:rounded-full ql:bg-idle ql:data-[status=active]:bg-active ql:data-[status=errored]:bg-failed"
      ></span>
      <span id="status-label">qlinter: Loading...</span>
      <button
        id="settings-button"
        class="ql:inline-flex ql:items-center ql:justify-center ql:ml-auto ql:p-1 ql:rounded-sm ql:text-muted ql:cursor-pointer ql:hover:bg-surface ql:hover:text-foreground ql:focus-visible:bg-surface ql:focus-visible:text-foreground"
        type="button"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
    </div>
    <button
      id="fix-all-button"
      class="ql:w-full ql:mt-2.5 ql:px-2.5 ql:py-1.5 ql:rounded-sm ql:border ql:border-border ql:bg-surface ql:cursor-pointer ql:hover:bg-border"
      hidden
    ></button>
    <div
      id="summary"
      class="ql:flex ql:gap-3.5 ql:mt-2 ql:-mx-3 ql:-mb-3 ql:px-3 ql:py-2 ql:bg-surface ql:border-t ql:border-border"
      hidden
    >
      <span class="ql:inline-flex ql:items-center ql:gap-1.25 ql:text-xs">
        <span class="ql:size-2 ql:rounded-full ql:bg-error"></span><span id="count-error">0</span>
      </span>
      <span class="ql:inline-flex ql:items-center ql:gap-1.25 ql:text-xs">
        <span class="ql:size-2 ql:rounded-full ql:bg-warning"></span><span id="count-warning">0</span>
      </span>
      <span class="ql:inline-flex ql:items-center ql:gap-1.25 ql:text-xs">
        <span class="ql:size-2 ql:rounded-full ql:bg-info"></span><span id="count-info">0</span>
      </span>
      <span id="score" class="ql:inline-flex ql:items-center ql:gap-1.25 ql:ml-auto ql:text-xs ql:text-muted" hidden>
        <!-- Tabular figures keep the score from shifting sideways as it updates on every keystroke. -->
        <span id="score-label"></span
        ><span id="score-value" class="ql:font-semibold ql:tabular-nums ql:text-foreground"></span>
      </span>
    </div>
    <button
      id="grant-button"
      class="ql:w-full ql:mt-2.5 ql:px-2.5 ql:py-1.5 ql:rounded-sm ql:border ql:border-border ql:bg-surface ql:cursor-pointer ql:hover:bg-border"
      hidden
    >
      Enable qlinter for this page
    </button>
    <script src="popup.js" type="module"></script>
  </body>
</html>
