<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>qlinter</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/options.css" />
  </head>
  <body class="ql:font-sans ql:text-sm ql:text-foreground ql:bg-background">
    <div class="ql:mx-auto ql:max-w-220 ql:px-8 ql:max-[600px]:px-4">
      <header class="ql:flex ql:items-center ql:gap-4 ql:pt-8 ql:pb-6 ql:border-b ql:border-border">
        <img src="images/qlinter.svg" class="ql:size-10 ql:shrink-0" alt="" />
        <div>
          <h1 id="options-title" class="ql:text-xl ql:font-semibold">qlinter</h1>
          <p id="options-subtitle" class="ql:text-muted"></p>
        </div>
      </header>
      <form id="options-form" novalidate>
        <section class="ql:py-6 ql:border-b ql:border-border">
          <h2 id="options-presets-label" class="ql:text-base ql:font-semibold"></h2>
          <p id="options-presets-help" class="ql:mt-0.5 ql:mb-3 ql:text-muted"></p>
          <ul id="options-preset-list" class="ql:flex ql:flex-wrap ql:gap-1.5 ql:mb-3"></ul>
          <div id="options-preset-add-row" class="ql:flex ql:gap-2">
            <select
              id="options-preset-select"
              class="ql:dropdown ql:h-6.5 ql:min-w-40 ql:pl-2 ql:pr-7 ql:rounded-sm ql:border ql:border-input-border ql:bg-input ql:text-foreground ql:cursor-pointer ql:focus:border-accent ql:focus:outline-1 ql:focus:-outline-offset-1 ql:focus:outline-accent ql:disabled:text-muted ql:disabled:cursor-not-allowed"
            ></select>
            <button
              type="button"
              id="options-preset-add"
              class="ql:h-6.5 ql:px-3 ql:rounded-sm ql:bg-secondary ql:text-foreground ql:cursor-pointer ql:hover:bg-secondary-hover ql:focus-visible:outline-1 ql:focus-visible:outline-offset-2 ql:focus-visible:outline-accent"
            ></button>
          </div>
        </section>
        <section class="ql:py-6 ql:border-b ql:border-border">
          <h2 id="options-rules-label" class="ql:text-base ql:font-semibold"></h2>
          <p id="options-rules-help" class="ql:mt-0.5 ql:mb-3 ql:text-muted"></p>
          <ul id="options-rule-list" class="ql:-mx-3"></ul>
        </section>
        <details id="options-advanced" class="ql:group ql:py-6">
          <summary
            class="ql:flex ql:items-center ql:gap-1.5 ql:w-fit ql:-ml-1 ql:pr-1 ql:rounded-sm ql:text-base ql:font-semibold ql:cursor-pointer ql:select-none ql:hover:bg-hover ql:focus-visible:outline-1 ql:focus-visible:outline-accent"
          >
            <svg
              class="ql:size-4 ql:text-muted ql:transition-transform ql:duration-150 ql:group-open:rotate-90"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 4l4 4-4 4" />
            </svg>
            <span id="options-config-label"></span>
          </summary>
          <p id="options-config-help" class="ql:mt-0.5 ql:mb-3 ql:text-muted"></p>
          <div
            id="options-config"
            class="ql:overflow-hidden ql:rounded-sm ql:border ql:border-input-border ql:focus-within:border-accent ql:focus-within:outline-1 ql:focus-within:-outline-offset-1 ql:focus-within:outline-accent ql:[&_.CodeMirror]:h-80 ql:[&_.CodeMirror]:font-mono ql:[&_.CodeMirror]:text-sm"
            aria-labelledby="options-config-label"
          ></div>
        </details>
        <div
          class="ql:sticky ql:bottom-0 ql:flex ql:flex-col ql:gap-3 ql:py-3 ql:bg-background/90 ql:backdrop-blur ql:border-t ql:border-border"
        >
          <div
            id="options-feedback"
            class="ql:px-3 ql:py-2 ql:rounded-sm ql:border-l-2 ql:whitespace-pre-wrap ql:data-[kind=error]:border-danger ql:data-[kind=error]:bg-danger-soft ql:data-[kind=error]:text-danger ql:data-[kind=success]:border-success ql:data-[kind=success]:bg-success-soft ql:data-[kind=success]:text-success"
            role="status"
            aria-live="polite"
            hidden
          ></div>
          <div class="ql:flex ql:gap-2">
            <button
              type="submit"
              id="options-save"
              class="ql:h-7 ql:px-4 ql:rounded-sm ql:bg-accent ql:text-on-accent ql:cursor-pointer ql:hover:bg-accent-hover ql:focus-visible:outline-1 ql:focus-visible:outline-offset-2 ql:focus-visible:outline-accent"
            ></button>
            <button
              type="button"
              id="options-reset"
              class="ql:h-7 ql:px-4 ql:rounded-sm ql:bg-secondary ql:text-foreground ql:cursor-pointer ql:hover:bg-secondary-hover ql:focus-visible:outline-1 ql:focus-visible:outline-offset-2 ql:focus-visible:outline-accent"
            ></button>
          </div>
        </div>
      </form>
    </div>
    <script src="options.js" type="module"></script>
  </body>
</html>
